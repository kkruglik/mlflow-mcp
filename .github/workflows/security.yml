name: Security Audit

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  security:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v6

      - name: Set up Python
        run: uv python install

      - name: Install dependencies
        run: uv sync

      - name: Check dependencies for known CVEs
        run: uv run pip-audit
        continue-on-error: true

      - name: Run bandit static analysis (high severity only)
        run: uv run bandit -ll -r src/

